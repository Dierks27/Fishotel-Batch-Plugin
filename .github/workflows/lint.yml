name: Lint

# Every push to main auto-deploys to the live store through the plugin's
# GitHub update checker (includes/class-updater.php reads the raw header on
# main), so a syntax error reaches fishotel.com within the hour. This gate
# catches parse errors on the PHP versions the server may run and runs the
# headless tests before anything lands on main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l every tracked PHP file
        run: |
          set -e
          git ls-files '*.php' | while read -r f; do php -l "$f" > /dev/null; done
          echo "PHP syntax OK on $(php -r 'echo PHP_VERSION;')"
      - name: Tests (PHP)
        if: matrix.php == '8.3'
        run: |
          set -e
          for t in $(git ls-files 'tests/*.php'); do
            echo "== $t"; php "$t"
          done
